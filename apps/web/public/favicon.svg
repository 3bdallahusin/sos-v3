  <!-- SOS Logo v3 Mark -->
  <!-- Left Geometric S -->
  <path
    d="M 21.5 24.5 L 15.5 24.5 C 13.5 24.5 12.5 25.5 12.5 27.5 L 12.5 28.5 C 12.5 30.5 13.5 31.5 15.5 31.5 L 18.5 31.5 C 20.5 31.5 21.5 32.5 21.5 34.5 L 21.5 36.5 C 21.5 38.5 20.5 39.5 18.5 39.5 L 12.5 39.5"
    stroke="#FFFFFF"
    stroke-width="3.5"
